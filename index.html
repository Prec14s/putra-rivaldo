<style>
  :root{
    --bg:#0a0c12;
    --bg-soft:#10131c;
    --panel:#141827;
    --line:#232a3d;
    --ink:#eef1f7;
    --ink-dim:#9aa3b8;
    --ink-faint:#5c657c;
    --red:#c8102e;
    --red-glow:#ff2d4d;
    --blue:#2447c4;
    --blue-glow:#4e78ff;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Inter', sans-serif;
    --display:'Archivo Black', sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    overflow-x:hidden;
    background-image:
      radial-gradient(ellipse 900px 500px at 85% -5%, rgba(200,16,46,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 40%, rgba(36,71,196,0.10), transparent 60%);
  }

  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--red);color:#fff;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  /* subtle web-line texture */
  .web-lines{position:fixed;inset:0;pointer-events:none;opacity:0.05;z-index:0;
    background-image:
      repeating-linear-gradient(115deg, transparent 0 78px, var(--red) 78px 79px),
      repeating-linear-gradient(25deg, transparent 0 96px, var(--blue) 96px 97px);
  }

  /* ---------- NAV ---------- */
  header nav .navlinks a::after{
  content:'';position:absolute;
  left:50%;right:auto;bottom:4px;
  width:0;height:1.5px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--red-glow),var(--blue-glow));
  border-radius:2px;
  transition:width .25s;
}
header nav .navlinks a:hover::after{width:55%;}

/* kapsul pas mengelilingi teks */
header nav .navlinks a::before{
  inset:0;border-radius:999px;
}
  /* ---------- NAVBAR KELAP-KELIP ---------- */
.navlinks{gap:8px;}
.navlinks a{
  position:relative;isolation:isolate;
  padding:8px 14px;border-radius:20px;
  animation:nav-twinkle 3.2s ease-in-out infinite;
  transition:color .25s, transform .25s, text-shadow .25s;
}
/* tiap menu berkedip bergantian */
.navlinks a:nth-child(1){animation-delay:0s;}
.navlinks a:nth-child(2){animation-delay:.4s;}
.navlinks a:nth-child(3){animation-delay:.8s;}
.navlinks a:nth-child(4){animation-delay:1.2s;}
.navlinks a:nth-child(5){animation-delay:1.6s;}

@keyframes nav-twinkle{
  0%,30%,70%,100%{color:var(--ink-dim);text-shadow:none;}
  45%{color:#fff;text-shadow:0 0 6px rgba(255,45,77,.9),0 0 16px rgba(255,45,77,.6);}
  55%{color:#fff;text-shadow:0 0 6px rgba(78,120,255,.9),0 0 16px rgba(78,120,255,.6);}
}

/* latar "kapsul" menyala saat hover */
.navlinks a::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,45,77,.2),rgba(78,120,255,.2));
  border:1px solid rgba(255,45,77,.5);
  box-shadow:0 0 18px rgba(255,45,77,.35);
  opacity:0;transform:scale(.85);
  transition:opacity .25s, transform .25s;
}
/* garis bawah gradasi merah-biru dari tengah */
.navlinks a::after{
  left:50%;transform:translateX(-50%);bottom:3px;
  background:linear-gradient(90deg,var(--red-glow),var(--blue-glow));
}
.navlinks a:hover{
  animation:none;color:#fff;transform:translateY(-2px);
  text-shadow:0 0 8px rgba(255,45,77,.8);
}

.navlinks a:active{transform:translateY(0) scale(.94);}

/* tombol Hubungi berdenyut + hover menyala */
nav > .btn{animation:btn-glow 2.4s ease-in-out infinite;}
@keyframes btn-glow{
  0%,100%{border-color:var(--line);box-shadow:none;}
  50%{border-color:var(--red-glow);box-shadow:0 0 14px rgba(255,45,77,.45);}
}
nav > .btn:hover{
  animation:none;background:var(--red);border-color:var(--red-glow);color:#fff;
  box-shadow:0 0 22px rgba(255,45,77,.6);transform:translateY(-2px);
}
nav > .btn:active{transform:scale(.95);}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:600;letter-spacing:0.02em;font-size:15px;}
  .logo-mark{width:30px;height:30px;flex:none;}
  .navlinks{display:flex;gap:34px;font-family:var(--mono);font-size:13px;letter-spacing:0.04em;color:var(--ink-dim);}
  .navlinks a{position:relative;padding:4px 0;transition:color .2s;}
  .navlinks a:hover{color:var(--ink);}
  .navlinks a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1.5px;background:var(--red);transition:width .25s;}
  .navlinks a:hover::after{width:100%;}
  .navlinks{display:none;}
  @media(min-width:760px){.navlinks{display:flex;}}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;z-index:1;
    padding:76px 0 100px;
  }
 .hero-grid{
  display:grid;grid-template-columns:1fr;gap:56px;
  justify-items:center;text-align:center;
}
.hero-grid .eyebrow{justify-content:center;}
.hero-grid .lede{margin-left:auto;margin-right:auto;}
.hero-grid .cta-row,
.hero-grid .hero-tags{justify-content:center;}
.portrait-wrap{width:100%;max-width:420px;}

  .eyebrow{
    font-family:var(--mono);font-size:12.5px;letter-spacing:0.14em;color:var(--red-glow);
    display:flex;align-items:center;gap:10px;margin-bottom:20px;text-transform:uppercase;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--red-glow);}

  h1.headline{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(38px,6vw,66px);
    line-height:1.02;
    letter-spacing:-0.01em;
    margin-bottom:22px;
  }
  h1.headline .hl{color:var(--red-glow);}
/* ---------- GLITCH HEADLINE ---------- */
/* ---------- GLITCH HEADLINE ---------- */
.glitch{
  position:relative;
  text-shadow:-1.5px 0 rgba(255,45,77,.55), 1.5px 0 rgba(78,120,255,.55);
  animation:glitch-skew 2.5s infinite steps(1);
}
.glitch::before,
.glitch::after{
  content:attr(data-text);
  position:absolute;inset:0;
  white-space:pre-line;
  pointer-events:none;
  opacity:0;
}
.glitch::before{color:var(--red-glow);animation:glitch-a 2.5s infinite steps(1);}
.glitch::after{color:var(--blue-glow);animation:glitch-b 2.5s infinite steps(1);}

@keyframes glitch-a{
  0%,70%,100%{opacity:0;transform:none;clip-path:inset(0 0 100% 0);}
  72%{opacity:.9;transform:translate(-8px,-2px);clip-path:inset(8% 0 62% 0);}
  76%{opacity:.9;transform:translate(6px,1px);clip-path:inset(55% 0 18% 0);}
  80%{opacity:.9;transform:translate(-5px,2px);clip-path:inset(30% 0 45% 0);}
  84%{opacity:.9;transform:translate(8px,-1px);clip-path:inset(78% 0 4% 0);}
  88%{opacity:0;}
}
@keyframes glitch-b{
  0%,70%,100%{opacity:0;transform:none;clip-path:inset(0 0 100% 0);}
  72%{opacity:.9;transform:translate(8px,2px);clip-path:inset(60% 0 12% 0);}
  76%{opacity:.9;transform:translate(-6px,-1px);clip-path:inset(15% 0 70% 0);}
  80%{opacity:.9;transform:translate(5px,-2px);clip-path:inset(42% 0 35% 0);}
  84%{opacity:.9;transform:translate(-8px,1px);clip-path:inset(5% 0 80% 0);}
  88%{opacity:0;}
}
@keyframes glitch-skew{
  0%,70%,88%,100%{transform:none;}
  74%{transform:skewX(-6deg) translateX(3px);}
  78%{transform:skewX(4deg) translateX(-3px);}
  82%{transform:skewX(-2deg);}
}

  .lede{
    font-size:16.5px;color:var(--ink-dim);max-width:480px;margin-bottom:34px;
  }
  .lede b{color:var(--ink);font-weight:600;}

  .cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:36px;}
  .btn{
    font-family:var(--mono);font-size:13.5px;letter-spacing:0.02em;
    padding:13px 24px;border-radius:3px;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:8px;transition:all .2s;
  }
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-glow);transform:translateY(-1px);}
  .btn-ghost{border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-faint);background:var(--panel);}

  .hero-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{
    font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);
    border:1px solid var(--line);padding:5px 10px;border-radius:20px;
  }

  /* ---------- REVEAL PORTRAIT ---------- */
  .portrait-wrap{position:relative;}
  .portrait{
    position:relative;
    width:100%;
    max-width:420px;
    margin:0 auto;
    aspect-ratio:3/4;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    cursor:none;
    background:#000;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .portrait img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    -webkit-user-select:none;user-select:none;pointer-events:none;
  }
  .portrait img.base{filter:saturate(1.05) contrast(1.03);}
  .portrait img.top{will-change:mask-position, -webkit-mask-image;}

  .reveal-dot{
    position:absolute;width:10px;height:10px;border-radius:50%;
    background:var(--red-glow);
    box-shadow:0 0 16px 4px rgba(255,45,77,0.6);
    pointer-events:none;transform:translate(-50%,-50%);
    opacity:0;transition:opacity .2s;z-index:5;
  }

  .portrait-caption{
    text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);
    margin-top:16px;letter-spacing:0.03em;
  }
  .portrait-caption b{color:var(--ink-dim);}

  /* ---------- SECTION SHELL ---------- */
  section{position:relative;z-index:1;padding:90px 0;border-top:1px solid var(--line);}
  .sec-head{margin-bottom:48px;}
  .sec-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;color:var(--blue-glow);text-transform:uppercase;margin-bottom:10px;}
  .sec-title{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,38px);letter-spacing:-0.01em;}

  /* ---------- ABOUT ---------- */
  .about-grid{display:grid;grid-template-columns:1fr;gap:44px;align-items:center;}
  @media(min-width:860px){.about-grid{grid-template-columns:1.3fr 1fr;}}
  .about-text p{color:var(--ink-dim);font-size:15.5px;margin-bottom:16px;max-width:560px;}
  .about-text b{color:var(--ink);font-weight:600;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center;}
  .stat{background:var(--panel);padding:24px 16px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .stat .num{font-family:var(--display);font-size:28px;color:var(--red-glow);margin-bottom:4px;}
  .stat .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:0.04em;text-transform:uppercase;}

  /* ---------- SKILLS ---------- */
  .skill-cats{display:grid;grid-template-columns:1fr;gap:36px;}
  @media(min-width:760px){.skill-cats{grid-template-columns:repeat(3,1fr);}}
  .skill-cat-title{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .skill{margin-bottom:16px;}
  .skill-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;}
  .skill-top span:last-child{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
  .bar{height:5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--red-glow));}
  .bar-fill.blue{background:linear-gradient(90deg,var(--blue),var(--blue-glow));}

  /* ---------- PROJECTS ---------- */
  .proj-grid{display:grid;grid-template-columns:1fr;gap:22px;}
  @media(min-width:760px){.proj-grid{grid-template-columns:repeat(3,1fr);}}
  .proj-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:26px;display:flex;flex-direction:column;gap:14px;
    transition:transform .25s, border-color .25s;
  }
  .proj-card:hover{transform:translateY(-4px);border-color:var(--red);}
  .proj-idx{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
  .proj-name{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:-0.01em;}
  .proj-desc{color:var(--ink-dim);font-size:14px;flex:1;}
  .proj-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .proj-tags span{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);border:1px solid var(--line);padding:3px 8px;border-radius:12px;}
  .proj-link{font-family:var(--mono);font-size:12.5px;color:var(--red-glow);display:inline-flex;align-items:center;gap:6px;margin-top:2px;}
  .proj-link:hover{text-decoration:underline;}

  /* ---------- CONTACT ---------- */
  .contact-box{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:56px 40px;text-align:center;position:relative;overflow:hidden;
  }
  .contact-box::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle 400px at 50% 0%, rgba(200,16,46,0.10), transparent 70%);
  }
  .contact-box h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.6vw,36px);margin-bottom:14px;position:relative;}
  .contact-box p{color:var(--ink-dim);max-width:460px;margin:0 auto 28px;position:relative;font-size:15px;}
  .contact-links{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative;}

  footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;}
  footer p{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  footer .edit-note{color:var(--blue-glow);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

<script>
(function(){
  const portrait = document.getElementById('portrait');
  const topImg = document.getElementById('topImg');
  const dot = document.getElementById('dot');

  let targetX = 50, targetY = 50, targetR = 0;
  let curX = 50, curY = 50, curR = 0;
  let hovering = false;

  function applyMask(){
    const r = curR;
    const inner = Math.max(r - 55, 0);
    topImg.style.webkitMaskImage = `radial-gradient(circle ${r}px at ${curX}% ${curY}%, transparent ${inner}px, rgba(0,0,0,1) ${r}px)`;
    topImg.style.maskImage = topImg.style.webkitMaskImage;
  }

  function loop(){
    curX += (targetX - curX) * 0.18;
    curY += (targetY - curY) * 0.18;
    curR += (targetR - curR) * 0.18;
    applyMask();
    requestAnimationFrame(loop);
  }
  loop();

  portrait.addEventListener('pointermove', function(e){
    const rect = portrait.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    targetX = x; targetY = y;
    targetR = Math.max(rect.width, rect.height) * 0.42;
    dot.style.left = (e.clientX - rect.left) + 'px';
    dot.style.top = (e.clientY - rect.top) + 'px';
    if(!hovering){ hovering = true; dot.style.opacity = '1'; }
  });

  portrait.addEventListener('pointerleave', function(){
    hovering = false;
    targetR = 0;
    dot.style.opacity = '0';
  });

  portrait.addEventListener('touchmove', function(e){
    const touch = e.touches[0];
    if(!touch) return;
    const rect = portrait.getBoundingClientRect();
    const x = ((touch.clientX - rect.left) / rect.width) * 100;
    const y = ((touch.clientY - rect.top) / rect.height) * 100;
    targetX = Math.min(Math.max(x,0),100);
    targetY = Math.min(Math.max(y,0),100);
    targetR = Math.max(rect.width, rect.height) * 0.42;
  }, {passive:true});

  portrait.addEventListener('touchend', function(){
    targetR = 0;
  });
})();
</script>

<script>

// Interactive Spiderweb Particle Canvas Animation
(function(){
  const canvas = document.getElementById('webCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', function(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initParticles();
  });

  const mouse = { x: null, y: null, maxDist: 170 };

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', function(){
    mouse.x = null;
    mouse.y = null;
  });

  let particles = [];
  const particleCount = Math.min(Math.floor((width * height) / 9000), 110);

  class Particle {
    constructor(){
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = (Math.random() - 0.5) * 1.2;
      this.radius = Math.random() * 2 + 1;
      // Red vs Blue accent nodes
      this.color = Math.random() > 0.3 ? 'rgba(255, 45, 77, ' : 'rgba(78, 120, 255, ';
      this.baseAlpha = Math.random() * 0.5 + 0.4;
    }

    update(){
      this.x += this.vx;
      this.y += this.vy;

      if(this.x < 0 || this.x > width) this.vx *= -1;
      if(this.y < 0 || this.y > height) this.vy *= -1;

      // Mouse attraction / interaction
      if(mouse.x !== null && mouse.y !== null){
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < mouse.maxDist){
          const force = (mouse.maxDist - dist) / mouse.maxDist;
          this.x += (dx / dist) * force * 1.5;
          this.y += (dy / dist) * force * 1.5;
        }
      }
    }

    draw(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color + this.baseAlpha + ')';
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color + '0.8)';
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function initParticles(){
    particles = [];
    const count = Math.min(Math.floor((width * height) / 9500), 120);
    for(let i = 0; i < count; i++){
      particles.push(new Particle());
    }
  }

  function drawWeb(){
    const maxConnectDist = 140;
    for(let i = 0; i < particles.length; i++){
      for(let j = i + 1; j < particles.length; j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if(dist < maxConnectDist){
          const alpha = (1 - dist / maxConnectDist) * 0.35;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          // Faint red-purple glowing lines
          ctx.strokeStyle = `rgba(200, 30, 70, ${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      // Connect to mouse cursor like spider web
      if(mouse.x !== null && mouse.y !== null){
        const mdx = particles[i].x - mouse.x;
        const mdy = particles[i].y - mouse.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if(mdist < mouse.maxDist){
          const malpha = (1 - mdist / mouse.maxDist) * 0.75;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(255, 45, 77, ${malpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
    }
  }

  function animate(){
    ctx.clearRect(0, 0, width, height);

    for(let i = 0; i < particles.length; i++){
      particles[i].update();
      particles[i].draw();
    }

    drawWeb();
    requestAnimationFrame(animate);
  }

  initParticles();
  animate();
})();

</script>
</body>
