<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyek — Putra Rivaldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c12; --panel:#141827; --line:#232a3d;
    --ink:#eef1f7; --ink-dim:#9aa3b8; --ink-faint:#5c657c;
    --red:#c8102e; --red-glow:#ff2d4d; --blue:#2447c4; --blue-glow:#4e78ff;
    --mono:'IBM Plex Mono', monospace; --sans:'Inter', sans-serif; --display:'Archivo Black', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;
    background-image:
      radial-gradient(ellipse 900px 500px at 85% -5%, rgba(200,16,46,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 40%, rgba(36,71,196,0.10), transparent 60%);
  }
  main{flex:1;position:relative;z-index:1;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--red);color:#fff;}
  :focus-visible{outline:2px solid var(--blue-glow);outline-offset:3px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  /* NAV */
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(10,12,18,0.72);border-bottom:1px solid var(--line);}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:600;font-size:15px;}
  .logo-mark{width:30px;height:30px;flex:none;}
  .navlinks{display:none;gap:34px;font-family:var(--mono);font-size:13px;letter-spacing:0.04em;color:var(--ink-dim);}
  @media(min-width:760px){.navlinks{display:flex;}}
  .navlinks a{position:relative;padding:4px 0;transition:color .2s;}
  .navlinks a:hover,.navlinks a.active{color:var(--ink);}
  .navlinks a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1.5px;background:var(--red);transition:width .25s;}
  .navlinks a:hover::after,.navlinks a.active::after{width:100%;}

  .btn{font-family:var(--mono);font-size:13.5px;letter-spacing:0.02em;padding:13px 24px;border-radius:3px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:all .2s;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-glow);}
  .btn-ghost{border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-faint);background:var(--panel);}

  /* HEAD */
  .page{padding:72px 0 100px;}
  .back{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);display:inline-block;margin-bottom:28px;}
  .back:hover{color:var(--ink);}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.4vw,58px);line-height:1.04;letter-spacing:-0.01em;margin-bottom:16px;}
  .intro{color:var(--ink-dim);max-width:560px;font-size:16px;margin-bottom:72px;}

  /* DAFTAR PROYEK */
  .project-list{display:flex;flex-direction:column;gap:96px;}
  .project{display:grid;grid-template-columns:1fr;gap:36px;align-items:center;}
  @media(min-width:900px){
    .project{grid-template-columns:1.25fr 1fr;gap:56px;}
    .project:nth-child(even){grid-template-columns:1fr 1.25fr;}
    .project:nth-child(even) .laptop{order:2;}
  }
  .p-name{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.15;margin-bottom:14px;}
  .p-desc{color:var(--ink-dim);font-size:15.5px;margin-bottom:18px;max-width:520px;}
  .p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
  .p-tags span{font-family:var(--mono);font-size:11px;color:var(--ink-dim);border:1px solid var(--line);padding:4px 10px;border-radius:12px;}
  .p-links{display:flex;flex-wrap:wrap;gap:12px;}

  /* ---------- MOCKUP LAPTOP ---------- */
  .laptop{width:100%;max-width:680px;margin:0 auto;padding:0 7%;filter:drop-shadow(0 30px 40px rgba(0,0,0,0.55));}
  .lid{
    position:relative;
    background:linear-gradient(180deg,#2a2e38,#1a1d24);
    border:1px solid #3a3f4b;
    border-radius:16px 16px 4px 4px;
    padding:3.2% 3.2% 4%;
  }
  .lid::before{ /* kamera */
    content:'';position:absolute;top:1.3%;left:50%;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;background:#0b0d12;box-shadow:0 0 0 1px #3a3f4b;
  }
  .screen{
    position:relative;aspect-ratio:16/10;overflow:hidden;
    background:#05060a;border-radius:3px;
  }
  .screen img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:top center;display:block;
  }
  .screen::after{ /* pantulan kaca */
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,0.07) 0%,rgba(255,255,255,0) 38%);
  }
  .screen .missing{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
    font-family:var(--mono);font-size:12px;color:var(--ink-faint);
  }
  .base{
    position:relative;height:0;padding-bottom:3.4%;
    width:116%;margin-left:-8%;
    background:linear-gradient(180deg,#3b404c 0%,#262a33 55%,#15171d 100%);
    border-radius:2px 2px 14px 14px;
  }
  .base::before{ /* cekungan untuk membuka layar */
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:16%;height:38%;background:#1a1d24;border-radius:0 0 8px 8px;
  }

  footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;position:relative;z-index:1;}
  footer p{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}

</style>
</head>

<script>
/* =========================================================
   DAFTAR PROYEK — CUKUP EDIT BAGIAN INI
   ---------------------------------------------------------
   1. Simpan screenshot proyek di folder "gambar/"
      (di dalam folder proyek/, sejajar dengan proyek.html).
      Ukuran terbaik: rasio 16:10, misalnya 1440 x 900 px.
   2. Satu blok { ... } per proyek:
      - nama      : nama proyek
      - deskripsi : penjelasan singkat
      - teknologi : daftar teknologi, dipisah koma di dalam [ ]
      - gambar    : path screenshot
      - demo      : (opsional) link website live, "" jika tidak ada
      - kode      : (opsional) link GitHub, "" jika tidak ada
   ========================================================= */
const PROYEK = [
  {
    nama: "Website PT. Alam Permata Riau",
    deskripsi: "Menangani pengembangan full-stack sekaligus maintenance website perusahaan, mulai dari sistem backend, manajemen data, hingga tampilan yang dipakai sehari-hari oleh tim internal.",
    teknologi: ["Laravel 12", "MySQL", "Blade"],
    gambar: "gambar/alam-permata-riau.jpg",
    demo: "",
    kode: ""
  },
  {
    nama: "POS Piscok Bang Gopal",
    deskripsi: "Sistem Point of Sale untuk usaha kuliner, awalnya dibangun dengan native PHP dan saat ini sedang dimigrasi ke Laravel 12 agar struktur kodenya lebih rapi dan mudah dikembangkan.",
    teknologi: ["Native PHP", "Migrasi ke Laravel 12", "MySQL"],
    gambar: "gambar/pos-piscok.jpg",
    demo: "",
    kode: ""
  },
  {
    nama: "Website Warkop Samalila",
    deskripsi: "Pengembangan dan pengelolaan website Warkop Samalila, sistem full-stack yang menghubungkan kebutuhan operasional dengan tampilan yang mudah digunakan pelanggan.",
    teknologi: ["Laravel 12", "MySQL", "Blade"],
    gambar: "gambar/warkop-samalila.jpg",
    demo: "",
    kode: ""
  }
];
/* ========================================================= */

(function(){
  const list = document.getElementById('projectList');

  PROYEK.forEach(function(p){
    const el = document.createElement('article');
    el.className = 'project';
    el.innerHTML = `
      <div class="laptop">
        <div class="lid"><div class="screen"><img loading="lazy"></div></div>
        <div class="base"></div>
      </div>
      <div class="p-info">
        <h2 class="p-name"></h2>
        <p class="p-desc"></p>
        <div class="p-tags"></div>
        <div class="p-links"></div>
      </div>`;

    const img = el.querySelector('img');
    const screen = el.querySelector('.screen');
    img.src = p.gambar;
    img.alt = 'Tampilan ' + p.nama;
    img.onerror = function(){
      img.remove();
      const m = document.createElement('div');
      m.className = 'missing';
      m.textContent = 'Gambar tidak ditemukan: ' + p.gambar;
      screen.prepend(m);
    };

    el.querySelector('.p-name').textContent = p.nama;
    el.querySelector('.p-desc').textContent = p.deskripsi;

    const tags = el.querySelector('.p-tags');
    (p.teknologi || []).forEach(function(t){
      const s = document.createElement('span'); s.textContent = t; tags.appendChild(s);
    });

    const links = el.querySelector('.p-links');
    if (p.demo){
      const a = document.createElement('a');
      a.href = p.demo; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'btn btn-primary'; a.textContent = 'Buka website';
      links.appendChild(a);
    }
    if (p.kode){
      const a = document.createElement('a');
      a.href = p.kode; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'btn btn-ghost'; a.textContent = 'Lihat kode';
      links.appendChild(a);
    }

    list.appendChild(el);
  });
})();

/* Latar jaring laba-laba (sama dengan halaman lain) */
(function(){
  const canvas = document.getElementById('webCanvas');
  const ctx = canvas.getContext('2d');
  let width, height, particles = [];
  const mouse = { x:null, y:null, maxDist:170 };

  function resize(){ width = canvas.width = innerWidth; height = canvas.height = innerHeight; init(); }
  addEventListener('resize', resize);
  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mouseleave', () => { mouse.x = mouse.y = null; });

  function init(){
    particles = [];
    const count = Math.min(Math.floor((width * height) / 9500), 120);
    for (let i = 0; i < count; i++){
      particles.push({
        x: Math.random()*width, y: Math.random()*height,
        vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2,
        r: Math.random()*2+1,
        c: Math.random() > 0.3 ? '255,45,77' : '78,120,255',
        a: Math.random()*0.5+0.4
      });
    }
  }

  function animate(){
    ctx.clearRect(0,0,width,height);
    for (const p of particles){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${p.c},${p.a})`; ctx.fill();
    }
    for (let i = 0; i < particles.length; i++){
      for (let j = i+1; j < particles.length; j++){
        const d = Math.hypot(particles[i].x-particles[j].x, particles[i].y-particles[j].y);
        if (d < 140){
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle = `rgba(200,30,70,${(1-d/140)*0.35})`; ctx.lineWidth = 0.8; ctx.stroke();
        }
      }
      if (mouse.x !== null){
        const d = Math.hypot(particles[i].x-mouse.x, particles[i].y-mouse.y);
        if (d < mouse.maxDist){
          ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(mouse.x,mouse.y);
          ctx.strokeStyle = `rgba(255,45,77,${(1-d/mouse.maxDist)*0.75})`; ctx.lineWidth = 1.2; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }

  resize();
  animate();
})();
</script>
<!-- ===== LABA-LABA BERAYUN ===== -->
<canvas id="spiderCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;"></canvas>
<script>
(function(){
  const cv = document.getElementById('spiderCanvas');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W, H, spiders = [];
  const mouse = { x:-999, y:-999, vx:0, px:-999 };

  /* Jumlah laba-laba menyesuaikan lebar layar (maks 10) */
  function jumlah(){ return Math.min(10, Math.max(4, Math.round(W / 150))); }

  function buat(){
    spiders = [];
    const n = jumlah();
    for (let i = 0; i < n; i++){
      const base = H * (0.18 + Math.random() * 0.45);           // panjang benang dasar
      spiders.push({
        ax: (W / n) * (i + 0.5) + (Math.random() - 0.5) * (W / n) * 0.6, // titik gantung
        base,
        amp: 30 + Math.random() * 60,                            // naik-turun memanjat
        climb: 0.3 + Math.random() * 0.5,                        // kecepatan memanjat
        phase: Math.random() * Math.PI * 2,
        th: (Math.random() - 0.5) * 0.8,                         // sudut ayunan
        om: 0,                                                   // kecepatan sudut
        size: 0.75 + Math.random() * 0.5,
        leg: Math.random() * Math.PI * 2
      });
    }
  }

  function size(){
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buat();
  }
  size(); addEventListener('resize', size);

  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = mouse.y = -999; });

  /* Jaring di pojok kiri & kanan atas */
  function jaringPojok(cx, cy, r, dari, sampai){
    const spokes = 7, rings = 6;
    ctx.strokeStyle = 'rgba(255,45,77,0.22)'; ctx.lineWidth = 0.8;
    const angs = [];
    for (let i = 0; i < spokes; i++) angs.push(dari + (sampai - dari) * i / (spokes - 1));
    angs.forEach(a => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); });
    for (let k = 1; k <= rings; k++){
      const rr = r * k / rings;
      ctx.beginPath();
      for (let i = 0; i < spokes - 1; i++){
        const a1 = angs[i], a2 = angs[i + 1], am = (a1 + a2) / 2;
        const x1 = cx + Math.cos(a1) * rr, y1 = cy + Math.sin(a1) * rr;
        const x2 = cx + Math.cos(a2) * rr, y2 = cy + Math.sin(a2) * rr;
        if (i === 0) ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx + Math.cos(am) * rr * 0.82, cy + Math.sin(am) * rr * 0.82, x2, y2);
      }
      ctx.stroke();
    }
  }

  /* Gambar satu laba-laba */
  function gambarSpider(x, y, ang, s, legT){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(s, s);

    // kaki: 4 kiri + 4 kanan, bergerak pelan
    ctx.strokeStyle = 'rgba(255,90,110,0.9)';
    ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let side = -1; side <= 1; side += 2){
      for (let i = 0; i < 4; i++){
        const wig = Math.sin(legT + i * 1.3 + (side > 0 ? 1 : 0)) * 0.12;
        const baseA = (-0.9 + i * 0.55) + wig;               // sudut pangkal kaki
        const kx = side * Math.cos(baseA) * 11, ky = Math.sin(baseA) * 11 - 2;
        const fx = side * (Math.cos(baseA) * 11 + 7), fy = ky + 9 + i * 1.5;
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      }
    }

    // badan
    ctx.shadowColor = 'rgba(255,45,77,0.7)'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#c8102e';
    ctx.beginPath(); ctx.ellipse(0, 7, 6.5, 8.5, 0, 0, Math.PI * 2); ctx.fill();   // perut
    ctx.fillStyle = '#ff2d4d';
    ctx.beginPath(); ctx.ellipse(0, -3, 4.2, 4.5, 0, 0, Math.PI * 2); ctx.fill();  // kepala-dada
    ctx.shadowBlur = 0;

    // motif di punggung
    ctx.strokeStyle = 'rgba(10,12,18,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(0, 14); ctx.moveTo(-4, 5); ctx.lineTo(4, 5); ctx.moveTo(-5, 9); ctx.lineTo(5, 9); ctx.stroke();

    // mata
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-1.6, -5, 1, 0, Math.PI * 2); ctx.arc(1.6, -5, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  let last = performance.now(), t = 0;
  function loop(now){
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    mouse.vx = mouse.x - mouse.px; mouse.px = mouse.x;

    ctx.clearRect(0, 0, W, H);
    const r = Math.min(170, W * 0.18);
    jaringPojok(0, 0, r, 0, Math.PI / 2);
    jaringPojok(W, 0, r, Math.PI / 2, Math.PI);

    for (const s of spiders){
      const L = s.base + Math.sin(t * s.climb + s.phase) * s.amp;   // memanjat naik-turun

      // fisika bandul
      s.om += (-(9.8 * 60) / L * Math.sin(s.th)) * dt;
      s.om *= 0.995;
      if (Math.abs(s.th) < 0.05 && Math.abs(s.om) < 0.3) s.om += (Math.random() - 0.5) * 1.6; // dorongan acak agar terus berayun

      const x = s.ax + Math.sin(s.th) * L;
      const y = Math.cos(s.th) * L;

      // kursor mendorong laba-laba
      const dx = x - mouse.x, dy = y - mouse.y;
      if (dx * dx + dy * dy < 90 * 90) s.om += (mouse.vx * 0.02 + Math.sign(dx) * 0.08) * (60 / L) * 3;
      s.om = Math.max(-3, Math.min(3, s.om));
      s.th += s.om * dt;

      // benang
      ctx.strokeStyle = 'rgba(238,241,247,0.35)'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(s.ax, 0); ctx.lineTo(x, y); ctx.stroke();

      s.leg += dt * (2 + Math.abs(s.om) * 3);
      gambarSpider(x, y + 4 * s.size, s.th * -1, s.size, s.leg);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<!-- ===== AKHIR LABA-LABA BERAYUN ===== -->
